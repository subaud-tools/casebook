# kempt manifest for casebook — kept separate from any dotfiles manifest.
#
#   kempt apply   -manifest cmd/casebook/kempt.toml -packages casebook
#   kempt upgrade -manifest cmd/casebook/kempt.toml -packages casebook
#
# -packages casebook is required: without it kempt applies the selection saved by
# your dotfiles `kempt init`, which does not contain "casebook".
# After the first apply: `casebook init` (defaults to, and if needed creates, a private `<you>/casebook-data`)
# and `casebook hooks install` (see internal/casebook/FORMAT.md). Needs kempt >= 0.5.3.

[kempt]
spec = 1

[packages.casebook]
description = "casebook: the fate of every repo, PR, issue, branch and worktree; journals git/gh activity"
only = { os = "darwin" }

  # The binary, from the family download contract (verified against .sha256).
  [[packages.casebook.download]]
  site = "casebook.tools"
  tool = "casebook"
  bin = "casebook"

  # Claude Code: journal Bash tool calls; brief the session on its repo.
  [[packages.casebook.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { PostToolUse = [ { matcher = "Bash", hooks = [ { type = "command", command = "~/.local/bin/casebook record --harness claude" } ] } ] } }

  [[packages.casebook.json-merge]]
  file = "~/.claude/settings.json"
  merge = { hooks = { SessionStart = [ { matcher = "startup|resume", hooks = [ { type = "command", command = "~/.local/bin/casebook brief" } ] } ] } }

  # Claude Code: the casebook plugin from the subaud-tools marketplace
  # (subaud-tools/plugins); the old casebook marketplace and its
  # casebook@casebook are removed. The next plain `claude` session installs
  # the plugin at user scope.
  # Its .mcp.json runs `casebook channel` for the tools and its mod runs
  # `casebook watch`, which turns each delivery of page messages into a turn.
  [[packages.casebook.json-merge]]
  file = "~/.claude/settings.json"
  merge = { extraKnownMarketplaces = { subaud-tools = { source = { source = "github", repo = "subaud-tools/plugins" }, autoUpdate = true } }, enabledPlugins = { "casebook@subaud-tools" = true } }
  remove = ["extraKnownMarketplaces.casebook", "enabledPlugins.casebook@casebook"]

  # The bare server the plugin replaces, or the channel would start twice.
  [[packages.casebook.json-merge]]
  file = "~/.claude.json"
  remove = ["mcpServers.casebook"]

  # pi: the same channel through channels.tools (which stamps the pi session id
  # and delivers only while the agent is settled).
  [[packages.casebook.json-merge]]
  file = "~/.pi/agent/channels.json"
  merge = { channelServers = { casebook = { command = "casebook", args = ["channel"] } } }

  # pi: pi-casebook (journal git/gh bash calls with the pi session id, brief the
  # first turn, and background `casebook sync --no-github`) is installed by the
  # DOTFILES manifest, not here: dotfiles owns pi's settings.json `packages`
  # list (arrays = "replace"), so a package added from any other manifest is
  # dropped on the next `kempt update`. It is listed there unpinned, so kempt
  # rolls it: publish the casebook binary before a pi-casebook that needs it.

  # Full sync (including the GitHub refresh) every 30 minutes.
  [[packages.casebook.service]]
  label = "tools.tackle.casebook.sync"
  program = ["/bin/zsh", "-lc", "exec \"$HOME/.local/bin/casebook\" sync"]
  keep-alive = false
  run-at-load = true
  start-interval = 1800
  process-type = "Background"
  session-type = "Aqua"
  stdout = "~/.local/state/casebook/sync.log"
  stderr = "~/.local/state/casebook/sync.log"

  [[packages.casebook.verify]]
  command-exists = "casebook"
